<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRM Protected Player</title>
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .player-container {
            width: 80%;
            max-width: 900px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .status-bar {
            padding: 15px;
            background: #2a2a2a;
            font-size: 14px;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ffcc00; /* Yellow = waiting */
            margin-right: 8px;
        }

        .status-indicator.loading { background-color: #ffcc00; }
        .status-indicator.ready { background-color: #00ff00; }
        .status-indicator.error { background-color: #ff0000; }

        .controls-hint {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="player-container">
    <video id="drm-video" controls crossorigin="use-credentials"></video>
</div>

<div class="status-bar">
    <span id="status-text">Initializing...</span>
    <div>
        <span class="status-indicator loading" id="indicator"></span>
        <span id="drm-type">Waiting for DRM...</span>
    </div>
</div>

<div class="controls-hint">
    Note: DRM often requires HTTPS or localhost. Some browsers may block local file playback.
</div>

<script>
    // --- CONFIGURATION ---
    const VIDEO_URL = 'https://test-streams.mux.dev/x3hrxsp/playlist.m3u8'; // Public test HLS stream
    
    // Example License Server URL (This is a generic one, you'll need your own)
    const LICENSE_SERVER_URL = 'https://cwip-shaka-proxy.appspot.com/license'; 

    // Widevine Configuration (Standard for Chrome/Android/Linux)
    const WIDEVINE_CONFIG = {
        serverUrl: LICENSE_SERVER_URL,
        // Optional: Headers needed for your specific DRM provider
        headers: {
            // 'Authorization': 'Bearer YOUR_TOKEN_HERE'
        },
        // Optional: Challenge data passed to the license server
        initData: null 
    };

    // FairPlay Configuration (For Safari - handled differently in code below)
    const FAIRPLAY_CONFIG = {
        // Usually requires a certificate URL and license server
        certificateUri: '',
        licenseServerUrl: ''
    };

    const video = document.getElementById('drm-video');
    const statusText = document.getElementById('status-text');
    const indicator = document.getElementById('indicator');
    const drmTypeLabel = document.getElementById('drm-type');

    function updateStatus(status, message) {
        statusText.textContent = message;
        indicator.className = `status-indicator ${status}`;
    }

    async function initPlayer() {
        // Check if browser supports EME (Encrypted Media Extensions)
        if (!navigator.requestMediaKeySystemAccess) {
            updateStatus('error', 'Your browser does not support EME (DRM).');
            return;
        }

        // Detect Browser
        if (Hls.isSupported()) {
            // Chrome, Firefox, Edge, etc. -> Use HLS.js + Widevine
            setupHlsPlayer();
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari -> Native HLS + FairPlay
            setupSafariPlayer();
        } else {
            updateStatus('error', 'No supported video format found.');
        }
    }

    function setupHlsPlayer() {
        const hls = new Hls();

        hls.loadSource(VIDEO_URL);
        hls.attachMedia(video);

        hls.on(Hls.Events.MEDIA_ATTACHED, () => {
            updateStatus('loading', 'Attached media. Waiting for encryption info...');
        });

        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
            console.log("Manifest parsed. Looking for encrypted streams...");
            
            // If the stream is already encrypted, we might need to set up DRM before playing
            // Or handle it when the first encrypted fragment is encountered
            
            // For this demo, we assume we want to force DRM initialization
            // Note: Real DRM usually initializes automatically if the manifest has cenc boxes
            
            video.play().catch(e => {
                console.warn("Autoplay blocked or DRM challenge failed.", e);
            });
        });

        // Intercept key request
        hls.config.drm = {
            systems: ['org.w3.clearkey', 'com.widevine.alpha'],
            clearkeys: {},
            // License server configuration
            licenseServer: {
                url: LICENSE_SERVER_URL
            }
        };

        // Handle DRM Session created
        video.addEventListener('encrypted', (event) => {
            console.log("DRM Event: Encrypted content detected.");
            updateStatus('loading', 'DRM Detected: Initializing Key System...');
            
            // In a real scenario, HLS.js handles the license request automatically 
            // if configured correctly above. If not, we'd use navigator.requestMediaKeySystemAccess here.
        });

        video.addEventListener('loadstart', () => {
            updateStatus('loading', 'Loading video...');
        });

        video.addEventListener('canplay', () => {
            updateStatus('ready', 'DRM Unlocked & Playing');
            drmTypeLabel.textContent = "Widevine (Simulated)";
        });

        video.addEventListener('error', (e) => {
            console.error("Video Error:", e);
            updateStatus('error', `Error: ${video.error ? video.error.message : 'Unknown'}`);
        });
    }

    function setupSafariPlayer() {
        // Safari uses FairPlay. We need to set the src directly.
        video.src = VIDEO_URL;
        
        video.addEventListener('loadedmetadata', () => {
             updateStatus('ready', 'Safari Ready (FairPlay)');
             drmTypeLabel.textContent = "FairPlay";
        });

        video.addEventListener('error', (e) => {
            updateStatus('error', 'Safari DRM Error');
        });
        
        video.play();
    }

    // Start
    initPlayer();

</script>
</body>
</html>
